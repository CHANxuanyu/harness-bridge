<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RepoBridge</title>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="项目与会话">
    <div class="sidebar-top">
      <button id="new-session" class="btn sidebar-new" type="button" title="新建会话（⌘N）">
        <svg class="i"><use href="#i-plus"/></svg><span>新建会话</span>
      </button>
      <label class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="filter" type="search" placeholder="筛选会话" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <nav id="tree" class="tree"></nav>
    <div class="sidebar-bottom">
      <button id="add-project" class="btn-plain" type="button"><svg class="i"><use href="#i-folder-plus"/></svg><span>添加项目…</span></button>
      <button id="open-settings" class="icon-btn" type="button" title="设置（⌘,）" aria-label="设置"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>
  <div id="sidebar-resizer" class="resizer resizer-sidebar" role="separator" aria-orientation="vertical" aria-label="调整侧边栏宽度"></div>
  <main id="main" class="main">
    <header id="toolbar" class="toolbar"></header>
    <div id="notice" class="notice-area"></div>
    <div id="stage" class="stage">
      <div id="terminals" class="terminals"></div>
      <div id="overlay" class="overlay"></div>
    </div>
  </main>
  <div id="inspector-resizer" class="resizer resizer-inspector" role="separator" aria-orientation="vertical" aria-label="调整辅助面板宽度"></div>
  <aside id="inspector" class="inspector" aria-label="辅助面板">
    <div class="inspector-head">
      <div id="inspector-tabs" class="segmented" role="tablist">
        <button role="tab" data-tab="changes" type="button">变更</button>
        <button role="tab" data-tab="activity" type="button">活动</button>
        <button role="tab" data-tab="details" type="button">详情</button>
      </div>
      <button id="close-inspector" class="icon-btn" type="button" title="关闭辅助面板（⌘\）" aria-label="关闭辅助面板"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div id="inspector-body" class="inspector-body"></div>
  </aside>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="layer" class="layer"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
